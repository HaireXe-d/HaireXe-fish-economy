# QQ 养鱼 / B 站养鱼（会读写日记、会跑命令的那条鱼）
#
# 什么时候需要这个文件：只有想改默认值的时候。
# 插件装完自带默认配置（五把刀全开、只作用于 whale 目录），直接用就行，不用抄这段。
#
# 用法：整段复制到 ~/.dsh/profiles/<你的 profile>/cordis.patch.yml 的末尾，保存后重启 DSH。

- id: fish-economy
  config:
    enabled: true
    fish:
      enabled: true
      preset: work        # fs + shell 常开，其它八组睡觉
    gate:
      # 只对路径里带 whale 的会话动手；写代码的会话完全不受影响。
      # 你的养鱼目录叫别的名字（fish / qq-bot…），就把这里换成那个词。
      scope: ['whale']
      autoEnable: true             # 你说"搜一下/看一下"时它会顺手把工具叫醒
    trim:
      enabled: true
      pruneToolResultChars: 2500   # 单条工具输出超过 2500 字就掐头去尾
    messages:
      enabled: true                # 投消息前把重复段落压成一句「后面同上」
      mode: short
    steps:
      enabled: true                # 加一句"能一次做完别拆多步"的提醒
    budget:
      enabled: true
      compactAtTokens: 150000      # 上下文超过 15 万就压一次（默认 20 万）
