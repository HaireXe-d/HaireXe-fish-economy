# 纯聊天鱼（从不读文件、不跑命令）
#
# 用法：整段复制到 ~/.dsh/profiles/web/cordis.patch.yml 的末尾，保存后重启 DSH。
# 和 work 版的区别只有一行：preset 换成 chat，工具全部睡觉，只剩 4 个"目录"工具。

- id: fish-economy
  config:
    enabled: true
    fish:
      enabled: true
      preset: chat
    gate:
      scope: ['whale']
    trim:
      enabled: true
      pruneToolResultChars: 2500
    budget:
      compactAtTokens: 150000
